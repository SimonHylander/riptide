name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # postinstall regenerates bun.nix, it must match the committed copy.
      - run: git diff --exit-code bun.nix
      - run: bun run typecheck
      - run: bun run test

  # Builds the compiled agent on x86_64-linux and runs it for 5s on the real
  # Linux collectors with the stdout gateway. `RIPTIDE_STDOUT_LAST_SEEN=now`
  # makes it report every second; at least 3 decodable reports must appear.
  # The agent must still be running when `timeout` stops it (exit 124); any
  # other status means it crashed or exited early.
  agent-nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: accept-flake-config = true
      - run: nix build .#agent -L
      - run: |
          status=0
          RIPTIDE_GATEWAY=stdout RIPTIDE_STDOUT_LAST_SEEN=now timeout 5 ./result/bin/riptide-agent > reports.jsonl || status=$?
          echo "agent exit status: $status"
          test "$status" -eq 124
          head -n 1 reports.jsonl
          jq -c 'select((.sample.cpu.totalPct | type) == "number" and .sample.memory.totalBytes > 0)' reports.jsonl > valid.jsonl
          echo "valid reports: $(wc -l < valid.jsonl)"
          test "$(wc -l < valid.jsonl)" -ge 3
