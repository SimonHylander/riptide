name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # postinstall regenerates bun.nix, it must match the committed copy.
      - run: git diff --exit-code bun.nix
      - run: bun run typecheck
      - run: bun run test

  # Builds the compiled agent on x86_64-linux and boots it. Without env the
  # agent must stop at config loading, which proves the binary runs.
  agent-nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: accept-flake-config = true
      - run: nix build .#agent -L
      - run: |
          if ./result/bin/riptide-agent > out.txt 2>&1; then
            echo "expected a config error without CONVEX_URL"; exit 1
          fi
          cat out.txt
          grep -q 'ConfigError' out.txt
